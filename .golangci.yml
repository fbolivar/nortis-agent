version: "2"

run:
  # El agente es solo para Windows: sin esto, el linter analiza con las etiquetas
  # de compilacion del runner y no ve nada de DPAPI, registro ni servicio — que
  # es justamente el codigo con mas riesgo.
  build-tags:
    - windows

linters:
  enable:
    - errcheck      # errores ignorados: el fallo mas comun y mas caro
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose     # respuestas HTTP sin cerrar: fuga de conexiones en un proceso que corre meses
    - errorlint     # comparaciones de error que se rompen al envolver
    - gosec         # problemas de seguridad; critico en un producto de seguridad

  settings:
    gosec:
      excludes:
        # G115 (conversiones enteras con posible desbordamiento) dispara en las
        # llamadas a la API de Windows, donde los tipos vienen impuestos por la
        # firma nativa y la conversion es correcta por construccion.
        - G115

    errcheck:
      # Se ignoran SOLO los cierres diferidos: en `defer x.Close()` no hay nada
      # que hacer con el error —la operacion util ya termino— y comprobarlos
      # obligaria a envolver cada uno en un closure que no aporta nada. El resto
      # de errores se sigue exigiendo, que es donde estan los fallos de verdad.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/fbolivar/nortis-agent/internal/queue.Queue).Close
        - (golang.org/x/sys/windows/registry.Key).Close
        # Llamadas a la API de Win32. `.Call` de un LazyProc/Proc devuelve el par
        # (r1, r2, err) donde `err` es SIEMPRE non-nil (envuelve GetLastError, que
        # solo importa si r1 indica fallo): comprobarlo como error de Go es un
        # falso positivo. CloseHandle es un cierre de recurso, como los demas Close.
        - (*golang.org/x/sys/windows.LazyProc).Call
        - (*golang.org/x/sys/windows.Proc).Call
        - golang.org/x/sys/windows.CloseHandle
        - (golang.org/x/sys/windows.Token).Close
        # Cierre y borrado de archivos temporales de diagnostico: es limpieza,
        # como los demas Close. El borrado que SI importa (cuarentena) comprueba
        # su error explicitamente y no pasa por aqui.
        - (*os.File).Close
        - os.Remove

  exclusions:
    rules:
      # En las pruebas se ignoran errores a proposito para no ahogar el caso que
      # se esta verificando entre comprobaciones irrelevantes.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

      # G103 (uso de `unsafe`) es inherente a llamar a la API de Win32: DPAPI
      # solo se alcanza pasando punteros a estructuras nativas. El codigo esta
      # acotado a un archivo pequeño, revisado, y copia los datos antes de
      # liberar la memoria que reserva Windows. Se excluye AQUI y solo aqui —
      # desactivarlo globalmente ocultaria un `unsafe` en cualquier otro sitio.
      - path: internal/dpapi/
        text: "G103"
        linters:
          - gosec

      # Mismo caso, misma acotacion: enumerar sesiones (WTS) y procesos
      # (Toolhelp) son llamadas a Win32 que reciben punteros a estructuras
      # nativas. El `unsafe` vive solo en los archivos _windows.go del paquete;
      # la logica que decide QUE se reporta es codigo puro, sin punteros, y es la
      # que esta cubierta por pruebas.
      - path: internal/collector/
        text: "G103"
        linters:
          - gosec

      # El paquete tamper lee la clave PUBLICA de la consola de una ruta fija
      # bajo el directorio de datos del agente (%ProgramData%\Nortis\Agent), no
      # de una entrada de usuario. G304 marca que la ruta se compone con una
      # variable —el directorio base—, pero ese directorio lo fija el agente, no
      # nadie de fuera. Acotado al paquete, donde la unica lectura es esa.
      - path: internal/tamper/
        text: "G304"
        linters:
          - gosec

      # La herramienta de operaciones (tools/, NO se despliega en los equipos)
      # lee una ruta de clave privada que le indica el operador (G304) y escribe
      # la clave PUBLICA con permiso de lectura general (G306) — es publica a
      # proposito. Las dos "señales" son el comportamiento correcto de un CLI que
      # ejecuta un operador de confianza, no del agente. Se acota solo a esa
      # carpeta.
      - path: tools/
        text: "G304|G306"
        linters:
          - gosec

      # El vigilante del portapapeles engancha la API de ventanas de Win32 con
      # punteros a estructuras nativas (G103), la misma clase de codigo ya
      # excluida en dpapi y collector.
      - path: internal/clipwatch/
        text: "G103|G104"
        linters:
          - gosec

      # Los colectores lanzan el proceso auxiliar en la sesion del usuario con la
      # ruta del propio ejecutable (G204) y leen archivos por rutas que reporta el
      # sistema de archivos, no una entrada de usuario (G304). Son inherentes a
      # integrar con Windows; la decision de QUE se reporta es codigo puro probado.
      - path: internal/collector/
        text: "G104|G204|G304"
        linters:
          - gosec

      # El aplicador de politica lee rutas del sistema (G304) y escribe el archivo
      # hosts, que DEBE quedar legible para todos para que la resolucion de
      # nombres lo use (G306): 0600 romperia el bloqueo de dominios.
      - path: internal/enforce/
        text: "G304|G306"
        linters:
          - gosec

      # La ejecucion remota lanza msiexec con argumentos que vienen de la consola
      # (G204) y descarga el MSI por una URL variable (G107): ES el proposito del
      # feature. La seguridad no la da gosec aqui sino la FIRMA Ed25519 que se
      # verifica antes de ejecutar y el sha256 del artefacto. Ver remoteexec.
      - path: internal/remoteexec/
        text: "G107|G204"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
